<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Support Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<style>
:root {
  --ground: #f3f4f1; --surface: #e4e7e1; --ink: #121614; --ink-2: #4a524d;
  --accent: #0a6b4b; --accent-ink: #ffffff;
  --field: #0b3d2c; --field-ink: #eef5f0; --field-2: #155240; --field-accent: #8ce0b9;
  --web: #1d4f91; --warn: #9b1c1c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111412; --surface: #1f2521; --ink: #eceeea; --ink-2: #a9b1ab;
    --accent: #3fb58a; --accent-ink: #08140f;
    --web: #5b8fd6; --warn: #e06666;
  }
}
:root[data-theme="dark"] {
  --ground: #111412; --surface: #1f2521; --ink: #eceeea; --ink-2: #a9b1ab;
  --accent: #3fb58a; --accent-ink: #08140f;
  --web: #5b8fd6; --warn: #e06666;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 17px/1.55 "Figtree", system-ui, sans-serif; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(300px, 32%) 1fr; height: 100dvh; }

aside { background: var(--field); color: var(--field-ink); padding: 32px; display: flex; flex-direction: column; gap: 40px; overflow: auto; }
aside h1 { font-size: clamp(40px, 4.4vw, 68px); line-height: .95; letter-spacing: -.035em; margin: 0; font-weight: 700; }
.topics { list-style: none; margin: 0; padding: 0; }
.topics button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 0; font-size: 21px; font-weight: 600; cursor: pointer; transition: color .15s, transform .15s; }
.topics button:hover { color: var(--field-accent); transform: translateX(4px); }
.topics button:active { transform: translateX(2px); }
.note { margin: auto 0 0; font-size: 16px; max-width: 34ch; }
.note strong { display: block; font-size: 18px; }

main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#log { overflow: auto; padding: 48px clamp(16px, 5vw, 80px) 24px; display: flex; flex-direction: column; gap: 40px; }
.empty { margin: auto 0 0; font-size: clamp(22px, 2.2vw, 32px); line-height: 1.3; letter-spacing: -.01em; max-width: 30ch; }
body.has-chat .empty { display: none; }

.msg { max-width: 72ch; animation: rise .28s ease-out both; }
.user { align-self: flex-end; background: var(--surface); padding: 14px 18px; max-width: 60ch; white-space: pre-wrap; }
.agent { display: flex; flex-direction: column; gap: 12px; }
.tag { align-self: flex-start; font-size: 14px; font-weight: 600; padding: 4px 10px; }
.tag.kb { background: var(--accent); color: var(--accent-ink); }
.tag.web { background: var(--web); color: #fff; }
.tag.direct { background: var(--surface); color: var(--ink); }
.tag.none, .tag.error { background: var(--warn); color: #fff; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body p { margin: .6em 0; } .body ul, .body ol { padding-left: 1.3em; } .body li { margin: .25em 0; }
.body h1, .body h2, .body h3, .body h4 { font-size: 18px; margin: 1em 0 .3em; }
.body code { background: var(--surface); padding: 1px 5px; font-size: .9em; }
.body pre { background: var(--surface); padding: 12px; overflow: auto; }
.body a, .cites a { color: var(--accent); }
.plain { white-space: pre-wrap; }
.pending .body { color: var(--ink-2); animation: pulse 1.2s ease-in-out infinite; }
.cites { margin: 0; font-size: 15px; color: var(--ink-2); }
details { font-size: 15px; color: var(--ink-2); }
summary { cursor: pointer; width: fit-content; }
details ol { margin: 8px 0 0; padding-left: 1.3em; }

#composer { display: flex; gap: 12px; padding: 16px clamp(16px, 5vw, 80px) 24px; }
#q { flex: 1; background: var(--surface); border: 0; padding: 16px; resize: none; max-height: 200px; line-height: 1.45; }
#q::placeholder { color: var(--ink-2); }
#send { background: var(--accent); color: var(--accent-ink); border: 0; padding: 0 28px; font-weight: 600; cursor: pointer; transition: transform .12s, opacity .15s; }
#send:hover { opacity: .9; } #send:active { transform: scale(.97); }
#send:disabled { opacity: .5; cursor: wait; }

@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { padding: 16px; gap: 16px; }
  aside h1 { font-size: 36px; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; }
  .topics button { width: auto; background: var(--field-2); padding: 8px 12px; font-size: 15px; }
  .topics button:hover { transform: none; }
  .note { display: none; }
  body.has-chat aside { display: none; }
  body.has-chat .app { grid-template-rows: 1fr; }
  #log { padding: 24px 16px; gap: 28px; }
  #composer { padding: 12px 16px 16px; }
  #send { padding: 0 18px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Ask IT. Get the policy.</h1>
    <ul class="topics" aria-label="Common questions">
      <li><button type="button" data-q="How do I connect to the company VPN?">VPN access</button></li>
      <li><button type="button" data-q="How do I reset my password and what is the password policy?">Password reset</button></li>
      <li><button type="button" data-q="How do I set up multi-factor authentication?">MFA setup</button></li>
      <li><button type="button" data-q="How do I request new software to be installed?">Installing software</button></li>
      <li><button type="button" data-q="My laptop was lost or stolen. What do I do?">Lost laptop</button></li>
      <li><button type="button" data-q="Outlook is not syncing my email. How do I fix it?">Email problems</button></li>
      <li><button type="button" data-q="My laptop is very slow. What should I check?">Slow laptop</button></li>
      <li><button type="button" data-q="I think I clicked a link in a phishing email. What do I do?">Phishing email</button></li>
      <li><button type="button" data-q="I'm leaving the company. What do I need to return?">Leaving the company</button></li>
    </ul>
    <p class="note"><strong>Lumio IT Copilot</strong>Answers come from the internal IT handbook first. The web is used only when the handbook has nothing, and those answers are marked.</p>
  </aside>

  <main>
    <div id="log" aria-live="polite">
      <p class="empty">Describe the problem in your own words. The copilot finds the matching policy and shows how it got there.</p>
    </div>
    <form id="composer">
      <textarea id="q" aria-label="Your question" rows="1" minlength="2" maxlength="3000" placeholder="Describe your IT problem" required></textarea>
      <button id="send" type="submit">Ask</button>
    </form>
  </main>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('composer');
const q = document.getElementById('q');
const send = document.getElementById('send');
let busy = false;

const SOURCES = {
  private_kb: ['From the IT handbook', 'kb'],
  web_search: ['From the web. Check with IT before changing managed devices', 'web'],
  direct: ['Direct reply, no lookup', 'direct'],
  insufficient_evidence: ['Not enough evidence', 'none'],
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function setBody(node, md) {
  // LLM and web text is untrusted: render markdown only when the sanitizer loaded
  if (window.marked && window.DOMPurify) node.innerHTML = DOMPurify.sanitize(marked.parse(md));
  else { node.textContent = md; node.classList.add('plain'); }
}

function show(node) { log.appendChild(node); node.scrollIntoView({ block: 'end', behavior: 'smooth' }); }

function fill(msg, data) {
  msg.classList.remove('pending');
  const [label, cls] = SOURCES[data.source_used] || [data.source_used || 'Answer', 'direct'];
  msg.prepend(el('span', 'tag ' + cls, label));
  setBody(msg.querySelector('.body'), data.answer || '');

  const cites = (data.citations || []).filter(c => c.title || c.url);
  if (cites.length) {
    const p = el('p', 'cites', 'Sources: ');
    cites.forEach((c, i) => {
      if (i) p.append(', ');
      if (c.url) { const a = el('a', '', c.title || c.url); a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; p.append(a); }
      else p.append(c.title);
    });
    msg.append(p);
  }
  if ((data.trace || []).length) {
    const d = el('details');
    d.append(el('summary', '', 'How the agent got here'));
    const ol = el('ol');
    data.trace.forEach(t => ol.append(el('li', '', t)));
    d.append(ol);
    msg.append(d);
  }
}

async function ask(text) {
  text = text.trim();
  if (text.length < 2 || busy) return;
  busy = true; send.disabled = true;
  document.body.classList.add('has-chat');
  show(el('div', 'msg user', text));
  q.value = ''; resize();

  const msg = el('div', 'msg agent pending');
  msg.append(el('div', 'body', 'Checking the handbook…'));
  show(msg);
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: text }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : data.detail ? JSON.stringify(data.detail) : `Request failed (${r.status})`);
    fill(msg, data);
  } catch (e) {
    msg.classList.remove('pending');
    msg.prepend(el('span', 'tag error', 'Something went wrong'));
    msg.querySelector('.body').textContent = e.message;
  } finally {
    busy = false; send.disabled = false; q.focus();
    msg.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }
}

function resize() { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; }

form.addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
q.addEventListener('input', resize);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
document.querySelectorAll('.topics button').forEach(b => b.addEventListener('click', () => ask(b.dataset.q)));
</script>
</body>
</html>
